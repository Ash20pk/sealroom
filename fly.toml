# Hosted web demo. One machine: open checks live in memory between requests.
app = "sealroom"
primary_region = "sin"

[build]

[env]
  SEALROOM_RUNS_PER_IP_HOUR = "6"
  SEALROOM_RUNS_PER_DAY = "80"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 1

[[http_service.checks]]
  method = "GET"
  path = "/"
  interval = "30s"
  timeout = "5s"

[mounts]
  source = "sealroom_state"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
